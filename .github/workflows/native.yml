name: Native SCADA validation
on:
  push:
    branches: [feature/cpp-winui3-scada]
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tcl-dev
      - run: bash native/scripts/build-linux.sh
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - name: Compile core, run protocol tests and build WinUI 3
        shell: pwsh
        run: ./native/scripts/build-windows.ps1 -Configuration Release
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Scada-Desktop-x64
          path: native/winui/out/x64/Release/
