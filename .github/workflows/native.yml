name: Native SCADA validation
on:
  push:
    branches: [feature/cpp-winui3-scada]
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tcl-dev
      - run: bash native/scripts/build-linux.sh
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - name: Compile native C++ core
        shell: pwsh
        run: ./native/scripts/build-windows.ps1 -Configuration Release -Phase Native
      - name: Run native CTest suites
        shell: pwsh
        run: ./native/scripts/build-windows.ps1 -Configuration Release -Phase Test
      - name: Build WinUI 3 desktop
        shell: pwsh
        run: ./native/scripts/build-windows.ps1 -Configuration Release -Phase Desktop
      - name: Preserve Windows diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-build-diagnostics
          path: |
            native/build-windows/diagnostics/*.log
            native/build-windows/ctest-results.xml
            native/build-windows/Testing/Temporary/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Scada-Desktop-x64
          path: native/winui/out/x64/Release/
